name: Accessibility Check

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.26"

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: .

      - name: 🚨 Check Accessibility Report for Failures
        id: axe_check
        run: |
          # 1. Check if the report file exists
          if [ ! -f "_site/axe-report.json" ]; then
            echo "::error::Accessibility report file not found! Check Quarto render output."
            exit 1
          fi

          # 2. Use 'jq' to count the number of critical/serious violations
          # Quarto reports *all* violations, so we filter down to 'critical' and 'serious' severity
          VIOLATION_COUNT=$(jq '[.violations[] | select(.impact == "critical" or .impact == "serious")] | length' _site/axe-report.json)
          
          echo "Found $VIOLATION_COUNT critical/serious accessibility violations."

          # 3. Fail the step if any violations were found
          if [ "$VIOLATION_COUNT" -gt 0 ]; then
            echo "::error::Accessibility check failed! Found $VIOLATION_COUNT critical/serious violations."
            echo "::error::Please fix violations reported in _site/axe-report.json before merging."
            # Set the status code to 1 to fail the job
            exit 1
          else
            echo "✅ Accessibility check passed (no critical or serious violations found)."
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-site
          path: ./_site
          retention-days: 7
